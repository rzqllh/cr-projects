name: CI (source-only)
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prevent accidental business data in commits
        run: |
          ! git ls-files | grep -Ei '(\.xlsx$|\.xls$|\.csv$|^dist/data\.js$|preview|snapshot.*\.json$)'
